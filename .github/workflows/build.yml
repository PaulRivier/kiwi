# Builds the release binary, on demand only: Actions tab → "Build binaries"
# → "Run workflow" (or: gh workflow run build.yml).
#
# Linux only: static binary (musl, GHC with native bignum), in an Alpine
# image, with cabal.project.musl. The binary is packaged with the themes
# and the documentation, since kiwi needs a theme to run.
#
# The package is attached to the run as an artifact (Summary page of the
# run), publish it with release.yml. The compiled dependencies are cached
# between runs, so only the first run compiles everything.

name: Build binaries

on:
  workflow_dispatch:

env:
  GHC_VERSION: 9.10.3
  EXE: kiwi

jobs:
  linux:
    runs-on: ubuntu-latest
    container: docker.io/benz0li/ghc-musl:9.10.3-int-native
    env:
      CABAL_DIR: /cabal
      PROJECT_FILE: cabal.project.musl
      BUILD_DIR: dist-musl
    steps:
      # git for checkout, GNU tar and zstd for actions/cache, file for the check
      - name: Install tools
        run: apk add --no-cache git tar zstd file

      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(awk 'tolower($1) == "version:" { print $2; exit }' "$EXE.cabal")" >> "$GITHUB_OUTPUT"

      - name: Restore cabal store
        uses: actions/cache@v6
        with:
          path: /cabal/store
          key: linux-musl-${{ env.GHC_VERSION }}-${{ hashFiles('*.cabal', 'cabal.project*', 'stackage/*') }}
          restore-keys: linux-musl-${{ env.GHC_VERSION }}-

      - name: Update package index
        run: cabal update

      - name: Build dependencies
        run: cabal build --project-file="$PROJECT_FILE" --builddir="$BUILD_DIR" --only-dependencies "exe:$EXE"

      - name: Build
        run: cabal build --project-file="$PROJECT_FILE" --builddir="$BUILD_DIR" "exe:$EXE"

      - name: Package
        id: package
        run: |
          name="$EXE-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "pkg/$name" out
          bin="pkg/$name/$EXE"
          cp "$(cabal list-bin --project-file="$PROJECT_FILE" --builddir="$BUILD_DIR" "exe:$EXE")" "$bin"
          strip "$bin"
          file "$bin" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          cp -r themes README.md ChangeLog.md LICENSE "pkg/$name/"
          tar -C pkg -czf "out/$name.tar.gz" "$name"
          cd out && sha256sum -- * > SHA256SUMS-linux
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/*
          if-no-files-found: error
